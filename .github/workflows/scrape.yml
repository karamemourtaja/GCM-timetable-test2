name: Update Mosque Timetable

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase beautifulsoup4
          seleniumbase install chromedriver

      - name: Run Scraper
        # Using xvfb to create a virtual display for the headless browser on Ubuntu
        run: xvfb-run python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add timetable.json
          git commit -m "Automated update: new timetable data" || echo "No changes to commit"
          git push